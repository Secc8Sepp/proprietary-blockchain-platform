<!DOCTYPE html>
<html lang="en" style="--bg-body: #0b0c10;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE OR DIE RADIO</title>
    <link rel="stylesheet" href="/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: auto;
            padding: 20px;
        }

        .radio-card {
            background: var(--bg-card);
            color: #fff;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid var(--danger);
            box-shadow: 0px 8px 40px rgba(255, 0, 85, 0.4);
            margin: 20px;
            position: relative;
        }

        #nowPlaying {
            background: rgba(0,0,0,0.3);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
            text-align: left;
        }

        #playBtn {
            background: var(--danger);
            border: none;
            color: #fff;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            margin-bottom: 10px;
        }

        #btnLabel {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="radio-card">
        <div style="position: absolute; top: 15px; left: 15px;">
            <a href="/index.html" style="font-size: 12px; color: var(--primary); text-decoration: none;">&laquo; Back to VOD Social</a>
        </div>

        <h3 style="margin: 30px 0 5px 0; letter-spacing: 3px; color: var(--danger); font-size: 22px; font-weight: 900;">VIBE OR DIE RADIO</h3>
        <p style="font-size: 11px; color: var(--success); letter-spacing: 1.5px; margin: 0 0 25px 0; font-weight: bold; font-family: monospace;">● 24/7 LIVE STREAM</p>

        <div id="nowPlaying">
            <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">NOW PLAYING</div>
            <div id="currentTrack" style="font-weight: bold; color: var(--primary); min-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Loading...</div>
        </div>
        
        <audio id="radioBrain" src="https://radio.vibeordie.social/stream.mp3" preload="none"></audio>
        
        <div>
            <button onclick="toggleVODRadio()" id="playBtn">▶</button>
        </div>
        
        <p id="btnLabel">CLICK TO TUNE IN</p>

        <div style="margin-top: 30px; border-top: 1px solid var(--border); padding-top: 25px;">
            <h4 style="margin: 0 0 10px 0; color: var(--primary);">New to the Swarm?</h4>
            <p style="font-size: 13px; color: var(--text-muted); margin: 0 0 15px 0;">Create a free account to connect with artists, build your clout, and start mining $VOD.</p>
            <a href="/index.html" style="display: inline-block; width: 100%; text-decoration: none;"><button style="width: 100%;">Join VOD Social</button></a>
        </div>
    </div>

    <div class="radio-card" style="border-color: var(--success); box-shadow: 0px 8px 40px rgba(31, 188, 115, 0.4); max-width: 380px; width: 100%; margin: 40px auto 20px auto;">
        <h4 style="margin: 0 0 10px 0; color: var(--success);">Got Heat?</h4>
        <p style="font-size: 13px; color: var(--text-muted); margin: 0 0 20px 0;">Submit your track for a chance to be featured on VIBE OR DIE RADIO.</p>
        
        <div style="text-align: left;">
            <label style="font-size: 12px;">Artist Name</label>
            <input id="submit-artist-name" type="text" placeholder="Your artist or band name..." style="margin-bottom: 10px;">
            
            <label style="font-size: 12px;">Track Title</label>
            <input id="submit-track-title" type="text" placeholder="The name of your masterpiece..." style="margin-bottom: 10px;">
            
            <label style="font-size: 12px;">Your MP3 File</label>
            <input id="submit-mp3-file" type="file" accept="audio/mpeg" style="margin-bottom: 15px;">
        </div>
        <button id="btn-submit-track" onclick="handleTrackSubmission()" style="width: 100%; background: var(--success); color: #000;">Submit for Review</button>
        <p id="submit-status" style="font-size: 12px; color: var(--warning); margin-top: 15px; min-height: 15px;"></p>
    </div>

    <script>
        function toggleVODRadio() {
            var stream = document.getElementById('radioBrain');
            var button = document.getElementById('playBtn');
            var label = document.getElementById('btnLabel');
            
            if (stream.paused) {
                stream.play();
                button.innerText = "■";
                label.innerText = "NOW STREAMING";
                label.style.color = "var(--success)";
            } else {
                stream.pause();
                button.innerText = "▶";
                label.innerText = "CLICK TO TUNE IN";
                label.style.color = "var(--text-muted)";
            }
        }

        function getNowPlaying() {
            fetch('https://radio.vibeordie.social/status-json.xsl')
                .then(response => response.json())
                .then(data => {
                    const source = data.icestats && (Array.isArray(data.icestats.source) ? data.icestats.source[0] : data.icestats.source);
                    document.getElementById('currentTrack').innerText = source && source.title ? source.title : '...';
                })
                .catch(error => { document.getElementById('currentTrack').innerText = 'Metadata unavailable'; });
        }

        getNowPlaying();
        setInterval(getNowPlaying, 10000);
    </script>
    <script>
        async function handleTrackSubmission() {
            const artistName = document.getElementById('submit-artist-name').value.trim();
            const trackTitle = document.getElementById('submit-track-title').value.trim();
            const fileInput = document.getElementById('submit-mp3-file');
            const file = fileInput.files[0];
            const statusEl = document.getElementById('submit-status');
            const submitBtn = document.getElementById('btn-submit-track');

            if (!artistName || !trackTitle || !file) {
                statusEl.innerText = 'Please fill out all fields and select a file.';
                return;
            }

            if (file.type !== 'audio/mpeg') {
                statusEl.innerText = 'Please upload a valid MP3 file.';
                return;
            }

            submitBtn.disabled = true;
            statusEl.style.color = 'var(--primary)';
            statusEl.innerText = 'Uploading...';

            const formData = new FormData();
            formData.append('artistName', artistName);
            formData.append('trackTitle', trackTitle);
            formData.append('track', file);

            try {
                const response = await fetch('/api/radio/submit-track', {
                    method: 'POST',
                    body: formData
                });
                const result = await response.json();
                if (!response.ok) {
                    throw new Error(result.message || 'An unknown error occurred.');
                }
                statusEl.style.color = 'var(--success)';
                statusEl.innerText = result.message;
                document.getElementById('submit-artist-name').value = '';
                document.getElementById('submit-track-title').value = '';
                fileInput.value = '';
            } catch (error) {
                statusEl.style.color = 'var(--danger)';
                statusEl.innerText = 'Upload failed: ' + error.message;
            } finally {
                submitBtn.disabled = false;
            }
        }
    </script>

</body>
</html>
