<!DOCTYPE html>
<html lang="en" style="--bg-body: #0b0c10;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIBE OR DIE RADIO</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    <style>
        #nowPlaying {
            background: rgba(0,0,0,0.3);
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 25px;
            border: 1px solid var(--border);
        }
        .signup-card {
            background: var(--bg-card);
            color: #fff;
            padding: 30px;
            border-radius: 16px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid var(--primary);
            box-shadow: 0px 8px 30px rgba(102, 252, 241, 0.2);
            margin: 40px auto 20px auto;
        }
    </style>
    <style>
        body {
            overflow: auto;
        }

        .radio-card {
            background: var(--bg-card);
            color: #fff;
            padding: 40px;
            border-radius: 16px;
            text-align: center;
            max-width: 380px;
            width: 100%;
            border: 1px solid var(--danger);
            box-shadow: 0px 8px 30px rgba(255, 0, 85, 0.35);
            position: relative;
            margin: 40px auto 20px auto;
        }

        .radio-title {
            margin: 0 0 5px 0;
            letter-spacing: 3px;
            color: var(--danger);
            font-size: 22px;
            font-weight: 900;
        }

        #streamStatus {
            font-size: 11px;
            color: var(--success);
            letter-spacing: 1.5px;
            margin: 0 0 25px 0;
            font-weight: bold;
            font-family: monospace;
        }

        #playBtn {
            background: var(--danger);
            border: none;
            color: #fff;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            font-size: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(255, 0, 85, 0.4);
            margin-bottom: 10px;
        }

        #playBtn:hover {
            background: #ff0055;
            opacity: 0.8;
            color: #fff;
        }

        #btnLabel {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 10px;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="radio-card">
        <div style="position: absolute; top: 15px; right: 15px;">
            <a href="/index.html" style="font-size: 12px; color: var(--primary); text-decoration: none;">&laquo; Back to Main Site</a>
        </div>

        <h3 class="radio-title">VIBE OR DIE RADIO</h3>
        <p id="streamStatus">● 24/7 LIVE STREAM</p>

        <div id="nowPlaying">
            <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 4px;">NOW PLAYING</div>
            <div id="currentTrack" style="font-weight: bold; color: var(--primary); min-height: 18px;">Loading...</div>
        </div>
        
        <audio id="radioBrain" src="https://radio.vibeordie.social/stream.mp3" preload="none"></audio>
        
        <div>
            <button onclick="toggleVODRadio()" id="playBtn">▶</button>
        </div>
        
        <p id="btnLabel">CLICK TO TUNE IN</p>
    </div>

    <div class="signup-card">
        <h3 style="color: var(--primary); margin-top: 0;">Join The Swarm</h3>
        <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Create a free account to start uploading, connecting with artists, and mining $VOD.</p>
        <div style="text-align: left; margin-bottom: 20px;">
            <label>Username</label>
            <input id="input-signup-username" placeholder="Choose your username..." style="margin-bottom: 12px;" />
            <label>Password</label>
            <input id="input-signup-password" type="password" placeholder="Choose a strong password..." style="margin-bottom: 12px;" />
            <label>Confirm Password</label>
            <input id="input-signup-password-confirm" type="password" placeholder="Confirm your password..." style="margin-bottom: 12px;" />
            <label>Referral Code (Optional)</label>
            <input id="input-signup-referrer" placeholder="Inviter's username..." style="margin-bottom: 12px;" />
            <label style="font-size: 12px; color: var(--text-muted); display: block; margin-bottom: 8px;">Upload your profile picture (Required)</label>
            <input id="input-signup-avatar" type="file" accept="image/*" style="margin-bottom: 12px;" />
        </div>
        <button id="btn-signup" onclick="window.CoreEngine.handleSignup()" style="width: 100%;">Create Account</button>
        <p id="auth-status" style="font-size: 12px; color: var(--warning); margin-top: 15px; min-height: 15px;"></p>
    </div>

    <div id="auth-screen" class="hidden"></div>

    <script>
        function toggleVODRadio() {
            var stream = document.getElementById('radioBrain');
            var button = document.getElementById('playBtn');
            var label = document.getElementById('btnLabel');
            
            if (stream.paused) {
                stream.play();
                button.innerText = "■";
                button.style.background = "var(--bg-darker)";
                button.style.border = "2px solid var(--danger)";
                label.innerText = "NOW STREAMING";
                label.style.color = "var(--success)";
            } else {
                stream.pause();
                stream.src = "https://radio.vibeordie.social/stream.mp3"; 
                button.innerText = "▶";
                button.style.background = "var(--danger)";
                button.style.border = "none";
                label.innerText = "CLICK TO TUNE IN";
                label.style.color = "var(--text-muted)";
            }
        }

        function getNowPlaying() {
            // This endpoint is standard for Icecast servers
            fetch('https://radio.vibeordie.social/status-json.xsl')
                .then(response => response.json())
                .then(data => {
                    let currentTrack = '...';
                    if (data.icestats && data.icestats.source) {
                        // The source can be an object or an array if there are multiple mountpoints
                        const source = Array.isArray(data.icestats.source) ? data.icestats.source[0] : data.icestats.source;
                        if (source.title) {
                            currentTrack = source.title;
                        }
                    }
                    document.getElementById('currentTrack').innerText = currentTrack;
                })
                .catch(error => {
                    document.getElementById('currentTrack').innerText = 'Metadata unavailable';
                });
        }

        // Fetch the currently playing track info on page load and then every 10 seconds.
        document.addEventListener('DOMContentLoaded', () => {
            // Setup for signup form
            const socket = io({ transports: ['websocket'] });
            window.CoreEngine.init(socket);
            // Setup for radio metadata
            getNowPlaying();
            setInterval(getNowPlaying, 10000);
        });
    </script>

    <!-- Scripts for Signup -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/elliptic/6.5.4/elliptic.min.js"></script>
    <script src="/utils.js?v=1.0.2"></script>
    <script src="/crypto.js?v=1.0.2"></script>
    <script src="/CoreEngine.js?v=1.0.2"></script>
    <script>
        // Mock functions needed by CoreEngine that are not relevant for signup
        window.WalletEngine = { init: () => {} };
    </script>

</body>
</html>
